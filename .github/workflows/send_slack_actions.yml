name: Slack Actiepunten Versturen

on:
  workflow_dispatch:
    inputs:
      slack_data:
        description: 'JSON met Slack actie data'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencies installeren
        run: pip install requests

      - name: Slack berichten versturen
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DATA: ${{ inputs.slack_data }}
        run: python tools/send_slack_actions.py
