name: Dagelijks Dashboard Update

on:
  schedule:
    - cron: '0 6,9,12,15,18 * * *'   # Elke 3 uur tussen 08:00–20:00 Amsterdam
  workflow_dispatch:       # Handmatig starten vanuit GitHub (of via dashboard-knop)

permissions:
  contents: write          # Nodig voor git push van workshops.db en gh-pages branch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 24 compatibiliteit

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Workshops scrapen
        env:
          TWIZE_API_KEY: ${{ secrets.TWIZE_API_KEY }}
          TWIZE_API_KEY_BE: ${{ secrets.TWIZE_API_KEY_BE }}
        run: python tools/scrape_workshops.py

      - name: Database bijwerken
        run: python tools/update_database.py

      - name: Dashboard genereren
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/generate_dashboard.py
          mkdir -p gh-pages
          cp dashboard.html gh-pages/index.html

      - name: Dashboard publiceren naar GitHub Pages
        run: |
          cd /tmp
          mkdir pages && cp $GITHUB_WORKSPACE/gh-pages/index.html pages/index.html
          cd pages
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "chore: dashboard update [skip ci]"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages

      - name: Dagelijkse Slack digest versturen (alleen 06:00 UTC)
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "$(date +%H)" = "06" ]; then
            echo "Ochtendrun — dagelijkse digest versturen..."
            python tools/send_slack_digest.py
          else
            echo "Geen ochtendrun, Slack digest overgeslagen."
          fi

      - name: Wekelijkse Slack digest versturen (alleen maandag 06:00 UTC)
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "$(date +%u)" = "1" ] && [ "$(date +%H)" = "06" ]; then
            echo "Maandag ochtend — wekelijks overzicht versturen..."
            python tools/send_slack_weekly.py
          else
            echo "Niet maandag ochtend, wekelijks overzicht overgeslagen."
          fi

      - name: Database committen (trenddata bewaren)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git pull --rebase origin master || git pull --rebase origin main
          git add .tmp/workshops.db
          git diff --staged --quiet || git commit -m "chore: database update $(date +%Y-%m-%d) [skip ci]"
          git push
