name: Dagelijks Dashboard Update

on:
  schedule:
    - cron: '0 6,9,12,15,18 * * *'   # Elke 3 uur tussen 08:00–20:00 Amsterdam
  workflow_dispatch:       # Handmatig starten vanuit GitHub (of via dashboard-knop)

permissions:
  contents: write          # Nodig voor git push van workshops.db

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 24 compatibiliteit

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Workshops scrapen
        env:
          TWIZE_API_KEY: ${{ secrets.TWIZE_API_KEY }}
          TWIZE_API_KEY_BE: ${{ secrets.TWIZE_API_KEY_BE }}
        run: python tools/scrape_workshops.py

      - name: Database bijwerken
        run: python tools/update_database.py

      - name: Dashboard genereren
        run: python tools/generate_dashboard.py

      - name: Historisch dashboard genereren
        run: python tools/generate_history_dashboard.py

      - name: Dashboard publiceren naar Apps Script
        env:
          APPS_SCRIPT_ID: "1gzVYcMinc-rU5XR5e0CKeht4_LUBie7sazllg6hywwuK3avMPZobmRhX"
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python tools/publish_to_apps_script.py

      - name: Dagelijkse Slack digest versturen (alleen 06:00 UTC)
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "$(date +%H)" = "06" ]; then
            echo "Ochtendrun — dagelijkse digest versturen..."
            python tools/send_slack_digest.py
          else
            echo "Geen ochtendrun, Slack digest overgeslagen."
          fi

      - name: Wekelijkse Slack digest versturen (alleen maandag 06:00 UTC)
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "$(date +%u)" = "1" ] && [ "$(date +%H)" = "06" ]; then
            echo "Maandag ochtend — wekelijks overzicht versturen..."
            python tools/send_slack_weekly.py
          else
            echo "Niet maandag ochtend, wekelijks overzicht overgeslagen."
          fi

      - name: Database committen (trenddata bewaren)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .tmp/workshops.db
          git diff --staged --quiet || git commit -m "chore: database update $(date +%Y-%m-%d) [skip ci]"
          git push
